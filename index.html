<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B4E">
<meta name="description" content="Lista de compras que soma o preço de cada item conforme você pega no mercado.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Lista do Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: uma coluna estreita tipo app; lista no meio, cupom com o total fixo no rodapé */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --ink:#1B2620; --muted:#5E6D64; --line:#DCE3DB;
  --accent:#2E6B4E; --accent-ink:#FFFFFF; --accent-soft:#E1EEE6; --paper:#FFFDF6; --warn:#B4532A;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --ink:#E6EDE8; --muted:#97A69D; --line:#2B3630;
  --accent:#6BBF92; --accent-ink:#0E1A13; --accent-soft:#1F3229; --paper:#202A25; --warn:#E58A62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --ink:#E6EDE8; --muted:#97A69D; --line:#2B3630;
  --accent:#6BBF92; --accent-ink:#0E1A13; --accent-soft:#1F3229; --paper:#202A25; --warn:#E58A62; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 240px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.notice{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice button{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;text-decoration:underline}

.add{display:flex;flex-direction:column;gap:8px}
.add-row{display:flex;gap:8px}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px;min-width:0;width:100%}
textarea{min-height:120px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:var(--surface)}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.9rem;padding:2px 0;align-self:flex-start}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 0}
.section-h h2{font-family:var(--f-display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.section-h span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item-main{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.done .tick{background:var(--accent);border-color:var(--accent)}
.tick svg{width:14px;height:14px;fill:none;stroke:var(--accent-ink);stroke-width:3;opacity:0}
.done .tick svg{opacity:1}
.name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.meta{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:block;font-weight:500;text-decoration:none}
.sum{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.extra{font-size:.7rem;font-weight:600;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin-left:6px}

.editor{border-top:1px dashed var(--line);padding:12px 14px 14px;display:grid;grid-template-columns:1fr 92px;gap:10px}
.editor label{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:4px}
.editor input{font-family:var(--f-mono);font-size:1.15rem}
.editor .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.editor .actions .btn:first-child{flex:1}
.err{grid-column:1/-1;color:var(--warn);font-size:.85rem;margin:0}

.empty{color:var(--muted);font-size:.95rem;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}

.done-card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px 18px 14px;font-family:var(--f-mono);position:relative}
.done-card::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px repeat-x,linear-gradient(45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px repeat-x}
.done-card h3{font-family:var(--f-display);font-size:1.3rem;margin:0 0 4px}
.done-card p{margin:0 0 12px;color:var(--muted);font-family:var(--f-body);font-size:.9rem}
.rc-line{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;padding:2px 0;font-variant-numeric:tabular-nums}
.rc-line span:first-child{min-width:0;overflow-wrap:anywhere}
.rc-total{border-top:1px dashed var(--muted);margin-top:8px;padding-top:8px;font-size:1.2rem;font-weight:700}

.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgb(0 0 0 / .06)}
.bar-in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bar small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.total{font-family:var(--f-mono);font-weight:700;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.count{font-family:var(--f-mono);font-size:.95rem;text-align:right}
.budget{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.budget label{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;flex:1;min-width:0}
.budget label span{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:.8rem}
.budget .money-in{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);color:var(--muted)}
.budget input{width:7.5em;font-family:var(--f-mono);font-size:1.05rem;text-align:right;padding:10px}
.bline{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bline.near{color:var(--warn)}
.bline.over{color:var(--warn);font-weight:700}
.total.over{color:var(--warn)}
.prog.bud i{background:var(--muted)}
.prog.bud.near i,.prog.bud.over i{background:var(--warn)}
.rc-budget{font-size:.85rem;margin-top:6px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Lista do Mercado</h1>
    <p class="sub">Escreva o que precisa, toque no item quando pegar e coloque o preço. O total vai somando sozinho.</p>
  </header>

  <div class="notice" id="sampleNotice" hidden>
    <span>Esta é uma lista de exemplo.</span>
    <button type="button" id="clearSample">Apagar e começar a minha</button>
  </div>

  <div class="budget">
    <label for="budgetIn">Orçamento<span>Opcional. Avisa quando chegar perto ou passar.</span></label>
    <div class="money-in">R$ <input id="budgetIn" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
  </div>

  <form class="add" id="addForm" autocomplete="off">
    <div class="add-row">
      <input id="newItem" placeholder="Ex.: arroz 5kg" aria-label="Novo item">
      <button class="btn" type="submit">Adicionar</button>
    </div>
    <button type="button" class="link" id="toggleBulk">Colar vários itens de uma vez</button>
    <div id="bulkBox" hidden>
      <textarea id="bulkText" placeholder="Um item por linha&#10;leite&#10;pão&#10;café"></textarea>
      <div class="add-row" style="margin-top:8px">
        <button class="btn" type="button" id="bulkAdd">Adicionar à lista</button>
      </div>
    </div>
  </form>

  <div id="finish"></div>

  <section>
    <div class="section-h"><h2>Falta pegar</h2><span id="pendCount"></span></div>
    <ul id="pending" style="margin-top:8px"></ul>
  </section>

  <section>
    <div class="section-h"><h2>No carrinho</h2><span id="cartCount"></span></div>
    <ul id="cart" style="margin-top:8px"></ul>
  </section>

  <section>
    <button type="button" class="link" id="addExtra">+ Peguei algo que não estava na lista</button>
  </section>

  <div class="foot" id="foot"></div>
</div>

<div class="bar" role="status" aria-live="polite">
  <div class="bar-in">
    <div class="bar-top">
      <div><small>Total no carrinho</small><div class="total" id="total">R$ 0,00</div></div>
      <div class="count"><small>Itens pegos</small><span id="progText">0 de 0</span></div>
    </div>
    <div class="prog"><i id="progBar"></i></div>
    <div id="budgetBox" hidden>
      <div class="bline" id="budgetLine"></div>
      <div class="prog bud" id="budgetProg" style="margin-top:6px"><i id="budgetBar"></i></div>
    </div>
  </div>
</div>

<script>
(function(){
  const KEY = "lista-mercado-v1";
  const fmt = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
  const money = v => fmt.format(v || 0);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Math.random().toString(36).slice(2,9);

  function parseNum(s){
    s = String(s||"").replace(/R\$|\s/g,"");
    if(!s) return NaN;
    if(s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
    return Number(s);
  }

  const sample = () => ["Arroz 5kg","Feijão carioca","Leite","Café 500g","Pão de forma","Tomate","Detergente"]
    .map(n => ({id:uid(),name:n,qty:1,price:null,done:false,extra:false}));
  // Exemplo: dois itens já no carrinho para mostrar como fica
  function sampleState(){
    const it = sample();
    it[0].done = true; it[0].price = 27.90;
    it[2].done = true; it[2].price = 4.79; it[2].qty = 6;
    return {items:it, sample:true};
  }

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e){ state = null; }
  if(!state || !Array.isArray(state.items)) state = sampleState();

  let openId = null, errMsg = "", confirmNew = false, focusEditor = false;

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function leaveSample(){ if(state.sample){ state.sample = false; } }

  const $ = id => document.getElementById(id);
  const check = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function editorHTML(it){
    const p = it.price != null ? String(it.price.toFixed(2)).replace(".",",") : "";
    const q = String(it.qty ?? 1).replace(".",",");
    return `<div class="editor">
      ${it.extra ? `<label style="grid-column:1/-1">Nome<input id="name-${it.id}" placeholder="O que você pegou?" value="${it.name === "Item extra" ? "" : esc(it.name)}"></label>` : ""}
      <label>Preço (R$)<input id="price-${it.id}" inputmode="decimal" placeholder="0,00" value="${p}"></label>
      <label>Qtd<input id="qty-${it.id}" inputmode="decimal" value="${q}"></label>
      ${errMsg ? `<p class="err">${esc(errMsg)}</p>` : ""}
      <div class="actions">
        <button class="btn" type="button" data-act="confirm" data-id="${it.id}">${it.done ? "Salvar" : "Pegar item"}</button>
        ${it.done ? `<button class="btn ghost" type="button" data-act="undo" data-id="${it.id}">Tirar do carrinho</button>` : ""}
        <button class="btn ghost" type="button" data-act="remove" data-id="${it.id}">Excluir</button>
        <button class="btn ghost" type="button" data-act="close">Cancelar</button>
      </div>
    </div>`;
  }

  function itemHTML(it){
    const sub = it.done ? it.price * it.qty : 0;
    const meta = it.done ? `${String(it.qty).replace(".",",")} × ${money(it.price)}` : "Toque quando pegar";
    return `<li class="item ${it.done ? "done" : ""}">
      <button class="item-main" type="button" data-act="open" data-id="${it.id}" aria-expanded="${openId===it.id}">
        <span class="tick">${check}</span>
        <span class="name">${esc(it.name)}${it.extra ? '<span class="extra">fora da lista</span>' : ""}<span class="meta">${meta}</span></span>
        ${it.done ? `<span class="sum">${money(sub)}</span>` : ""}
      </button>
      ${openId === it.id ? editorHTML(it) : ""}
    </li>`;
  }

  function render(){
    const items = state.items;
    const pend = items.filter(i => !i.done), cart = items.filter(i => i.done);
    const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
    const planned = items.filter(i => !i.extra);
    const plannedDone = planned.filter(i => i.done).length;

    $("sampleNotice").hidden = !state.sample;
    $("pending").innerHTML = pend.length ? pend.map(itemHTML).join("") :
      `<li class="empty">${items.length ? "Nada faltando." : "Sua lista está vazia. Escreva o primeiro item acima."}</li>`;
    $("cart").innerHTML = cart.length ? cart.map(itemHTML).join("") : `<li class="empty">Nenhum item pego ainda.</li>`;
    $("pendCount").textContent = pend.length ? pend.length + (pend.length === 1 ? " item" : " itens") : "";
    $("cartCount").textContent = cart.length ? money(total) : "";

    $("total").textContent = money(total);

    // Orçamento
    const bud = state.budget;
    $("budgetBox").hidden = !(bud > 0);
    $("total").classList.toggle("over", bud > 0 && total > bud);
    let budStatus = "";
    if(bud > 0){
      const left = bud - total, pct = total / bud;
      const cls = total > bud ? "over" : pct >= 0.9 ? "near" : "";
      $("budgetLine").className = "bline " + cls;
      $("budgetProg").className = "prog bud " + cls;
      $("budgetLine").innerHTML = total > bud
        ? `<span>Passou do orçamento</span><span>+ ${money(-left)}</span>`
        : `<span>${cls === "near" ? "Quase no limite · " : ""}Restam de ${money(bud)}</span><span>${money(left)}</span>`;
      $("budgetBar").style.width = Math.min(100, pct * 100) + "%";
      budStatus = total > bud
        ? `<div class="rc-line rc-budget"><span>Passou do orçamento de ${money(bud)}</span><span>+ ${money(-left)}</span></div>`
        : `<div class="rc-line rc-budget"><span>Sobrou do orçamento de ${money(bud)}</span><span>${money(left)}</span></div>`;
    }
    $("progText").textContent = `${plannedDone} de ${planned.length}`;
    $("progBar").style.width = planned.length ? (plannedDone / planned.length * 100) + "%" : "0";

    // Compra finalizada
    if(items.length && !pend.length){
      const units = cart.reduce((s,i) => s + i.qty, 0);
      $("finish").innerHTML = `<div class="done-card">
        <h3>Pegou tudo da lista!</h3>
        <p>${cart.length} ${cart.length === 1 ? "item" : "itens"} no carrinho. Confira o resumo antes de passar no caixa.</p>
        ${cart.map(i => `<div class="rc-line"><span>${esc(i.name)} ${i.qty !== 1 ? "(" + String(i.qty).replace(".",",") + "×)" : ""}</span><span>${money(i.price*i.qty)}</span></div>`).join("")}
        <div class="rc-line rc-total"><span>TOTAL</span><span>${money(total)}</span></div>
        ${budStatus}
      </div>`;
    } else $("finish").innerHTML = "";

    $("foot").innerHTML = !items.length ? "" : confirmNew
      ? `<div class="confirm"><span>Apagar tudo e começar uma lista nova?</span>
         <button class="btn danger" type="button" data-act="newyes">Sim, apagar</button>
         <button class="btn ghost" type="button" data-act="newno">Não</button></div>`
      : `<button class="btn ghost" type="button" data-act="newask">Nova lista</button>
         ${cart.length ? `<button class="btn ghost" type="button" data-act="reuse">Usar a mesma lista de novo</button>` : ""}`;

    if(openId && focusEditor){
      focusEditor = false;
      const cur = state.items.find(i => i.id === openId);
      if(!(cur && cur.extra && !cur.done)) $("price-" + openId)?.focus();
    }
    save();
  }

  function addNames(names, extra){
    leaveSample();
    const added = [];
    names.map(n => n.trim()).filter(Boolean).forEach(n => {
      const it = {id:uid(),name:n,qty:1,price:null,done:false,extra:!!extra};
      state.items.push(it); added.push(it);
    });
    return added;
  }

  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("newItem").value;
    if(!v.trim()) return;
    addNames([v]); $("newItem").value = ""; render(); $("newItem").focus();
  });
  if(state.budget > 0) $("budgetIn").value = state.budget.toFixed(2).replace(".",",");
  $("budgetIn").addEventListener("input", () => {
    const v = parseNum($("budgetIn").value);
    state.budget = v > 0 ? v : null;
    render();
  });
  $("budgetIn").addEventListener("blur", () => {
    if(state.budget > 0) $("budgetIn").value = state.budget.toFixed(2).replace(".",",");
  });
  $("toggleBulk").addEventListener("click", () => { $("bulkBox").hidden = !$("bulkBox").hidden; if(!$("bulkBox").hidden) $("bulkText").focus(); });
  $("bulkAdd").addEventListener("click", () => {
    addNames($("bulkText").value.split(/\n|;/)); $("bulkText").value = ""; $("bulkBox").hidden = true; render();
  });
  $("clearSample").addEventListener("click", () => { state = {items:[], sample:false, budget:state.budget}; openId = null; render(); $("newItem").focus(); });
  $("addExtra").addEventListener("click", () => {
    const [it] = addNames(["Item extra"], true);
    openId = it.id; errMsg = ""; render();
    $("name-" + it.id)?.focus();
  });

  function showErr(id, msg){
    const ed = $("price-" + id)?.closest(".editor");
    if(!ed) return;
    let p = ed.querySelector(".err");
    if(!p){ p = document.createElement("p"); p.className = "err"; ed.querySelector(".actions").before(p); }
    p.textContent = msg;
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if(!b) return;
    const act = b.dataset.act, it = state.items.find(i => i.id === b.dataset.id);
    if(act === "open"){ openId = openId === it.id ? null : it.id; focusEditor = true; errMsg = ""; render(); }
    else if(act === "close"){
      const cur = state.items.find(i => i.id === openId);
      if(cur && cur.extra && !cur.done) state.items = state.items.filter(i => i !== cur);
      openId = null; errMsg = ""; render(); }
    else if(act === "confirm"){
      const price = parseNum($("price-" + it.id).value);
      const qty = parseNum($("qty-" + it.id).value || "1");
      const nameEl = $("name-" + it.id);
      if(isNaN(price) || price < 0){ showErr(it.id, "Digite o preço, por exemplo 4,99."); return; }
      if(!(qty > 0)){ showErr(it.id, "A quantidade precisa ser maior que zero."); return; }
      if(nameEl && nameEl.value.trim()) it.name = nameEl.value.trim();
      leaveSample();
      it.price = Math.round(price * 100) / 100; it.qty = qty; it.done = true;
      openId = null; errMsg = ""; render();
    }
    else if(act === "undo"){ it.done = false; openId = null; render(); }
    else if(act === "remove"){ state.items = state.items.filter(i => i !== it); openId = null; render(); }
    else if(act === "newask"){ confirmNew = true; render(); }
    else if(act === "newno"){ confirmNew = false; render(); }
    else if(act === "newyes"){ state = {items:[], sample:false, budget:state.budget}; confirmNew = false; openId = null; render(); $("newItem").focus(); }
    else if(act === "reuse"){
      state.items = state.items.filter(i => !i.extra).map(i => ({...i, done:false, price:null, qty:1}));
      state.sample = false; openId = null; render(); window.scrollTo({top:0});
    }
  });

  document.addEventListener("keydown", e => {
    if(e.key === "Enter" && openId && e.target.matches(".editor input")){
      e.preventDefault();
      document.querySelector(`[data-act="confirm"][data-id="${openId}"]`)?.click();
    }
  });

  render();
  // não roubar o foco ao abrir a página
  if(openId === null) document.activeElement?.blur?.();
})();
</script>

</body>
</html>
